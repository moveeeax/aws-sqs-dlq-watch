[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-sqs-dlq-watch"
version = "0.2.0"
description = "Audit SQS dead-letter queues: backlogged DLQs, stale messages, orphan DLQs and source queues with no redrive policy."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Michael Tarassov", email = "michael@tarassov.me" }]
keywords = ["aws", "sqs", "dlq", "sre", "cli", "audit"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: System :: Monitoring",
]
dependencies = ["boto3>=1.40"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.15"]

[project.urls]
Homepage = "https://github.com/moveeeax/aws-sqs-dlq-watch"
Issues = "https://github.com/moveeeax/aws-sqs-dlq-watch/issues"

[project.scripts]
aws-sqs-dlq-watch = "sqs_dlq_watch.cli:main"

[tool.setuptools]
packages = ["sqs_dlq_watch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
